name: suts-agent-memory-transactions-it
services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: agent-archive-integration-only
      MYSQL_DATABASE: agent_archive_it
    ports: ["127.0.0.1:13316:3306"]
    volumes: ["./mysql-init.sql:/docker-entrypoint-initdb.d/fixture.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=agent-archive-integration-only mysql -h127.0.0.1 -uroot agent_archive_it -e 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 60
  redis:
    image: redis:8.2.1
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--requirepass", "agent-transactions-integration-only"]
    ports: ["127.0.0.1:16391:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "agent-transactions-integration-only", "PING"]
      interval: 2s
      timeout: 2s
      retries: 30
  nameserver:
    image: apache/rocketmq:5.4.0
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
    ports: ["127.0.0.1:19876:9876"]
  broker:
    image: apache/rocketmq:5.4.0
    command: sh mqbroker -c /home/rocketmq/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    volumes: ["./broker.conf:/home/rocketmq/broker.conf:ro"]
    ports: ["127.0.0.1:10931:10931"]
    depends_on: [nameserver]
