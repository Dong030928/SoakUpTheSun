server:
  port: ${AGENT_PORT:10000}
spring:
  profiles:
    default: local
  application:
    name: agent
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 50000ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    openfeign:
      okhttp:
        # 开启 OkHttp
        enabled: true
      httpclient:
        # 最大连接数
        max-connections: 1000
        # 每个目标服务的最大连接数
        max-connections-per-route: 200

suts:
  ai:
    # 1. 基础地址
    api-host: ${AI_API_HOST:https://api.deepseek.com}
    # 2. 你的 Key
    api-key: ${AI_API_KEY:}
    # 3. 模型代码
    model-name: ${AI_MODEL_NAME:deepseek-chat}
    # 4. 向量模型
    embedding-host: ${AI_EMBEDDING_HOST:https://api.siliconflow.cn/v1}
    embedding-api-key: ${AI_EMBEDDING_API_KEY:}
    embedding-model-name: ${AI_EMBEDDING_MODEL_NAME:}
    # 其他设置
    timeout: 60000
    temperature: 0.5
    # 向量维度
    vector:
      # 向量维度，DeepSeek 是 1024
      dimension: 1024
    chat:
      # 用户上下文长度
      max-context-char-limit: 4000
      # Redis 里最多保留多少条物理数据
      redis-physical-limit: 50
