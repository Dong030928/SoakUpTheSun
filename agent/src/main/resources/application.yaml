server:
  port: ${AGENT_PORT:10000}
spring:
  profiles:
    default: local
  application:
    name: agent
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 50000ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    openfeign:
      okhttp:
        # 开启 OkHttp
        enabled: true
      httpclient:
        # 最大连接数
        max-connections: 1000
        # 每个目标服务的最大连接数
        max-connections-per-route: 200

suts:
  ai:
    # 1. 基础地址
    api-host: ${AI_API_HOST:https://api.deepseek.com}
    # 2. 你的 Key
    api-key: ${AI_API_KEY:}
    # 3. 模型代码
    model-name: ${AI_MODEL_NAME:deepseek-chat}
    # 4. 向量模型
    embedding-host: ${AI_EMBEDDING_HOST:https://api.siliconflow.cn/v1}
    embedding-api-key: ${AI_EMBEDDING_API_KEY:}
    embedding-model-name: ${AI_EMBEDDING_MODEL_NAME:}
    embedding-timeout: ${AI_EMBEDDING_TIMEOUT:10000}
    embedding-enabled: ${AI_EMBEDDING_ENABLED:true}
    # 其他设置
    timeout: ${AI_TIMEOUT:60000}
    temperature: 0.5
    # Independent R02 retrieval; profile memory is optional for document-only queries.
    rag:
      enabled: ${AI_RAG_ENABLED:false}
      jdbc-url: ${AI_RAG_JDBC_URL:}
      username: ${AI_RAG_USERNAME:}
      password: ${AI_RAG_PASSWORD:}
      migrate: ${AI_RAG_MIGRATE:false}
      profile-quota: ${AI_RAG_PROFILE_QUOTA:10}
      document-quota: ${AI_RAG_DOCUMENT_QUOTA:40}
      elasticsearch:
        endpoint: ${AI_RAG_ES_ENDPOINT:http://127.0.0.1:9200}
        index-name: ${AI_RAG_ES_INDEX:suts-agent-rag-v1}
        username: ${AI_RAG_ES_USERNAME:}
        password: ${AI_RAG_ES_PASSWORD:}
      reranker:
        endpoint: ${AI_RAG_RERANK_ENDPOINT:https://api.siliconflow.cn/v1}
        api-key: ${AI_RAG_RERANK_API_KEY:}
        model: ${AI_RAG_RERANK_MODEL:Qwen/Qwen3-Reranker-0.6B}
    # 向量维度
    vector:
      # 必须与当前 Embedding 模型及既有 Redis 索引一致
      dimension: ${AI_VECTOR_DIMENSION:1024}
    memory:
      writes-enabled: ${AI_MEMORY_WRITES_ENABLED:true}
      max-messages: ${AI_MEMORY_MAX_MESSAGES:20}
      max-input-chars: ${AI_MEMORY_MAX_INPUT_CHARS:4000}
      max-message-chars: ${AI_MEMORY_MAX_MESSAGE_CHARS:4000}
      max-context-chars: ${AI_MEMORY_MAX_CONTEXT_CHARS:12000}
      long-term-chars: ${AI_MEMORY_LONG_TERM_CHARS:2000}
      ttl-seconds: ${AI_MEMORY_TTL_SECONDS:86400}
      lease-ms: ${AI_MEMORY_LEASE_MS:30000}
      # JDBC is optional; live asynchronous archival additionally requires transactions.enabled.
      archive:
        enabled: ${AI_MEMORY_ARCHIVE_ENABLED:false}
        jdbc-url: ${AI_MEMORY_ARCHIVE_JDBC_URL:}
        username: ${AI_MEMORY_ARCHIVE_USERNAME:}
        password: ${AI_MEMORY_ARCHIVE_PASSWORD:}
        migrate: ${AI_MEMORY_ARCHIVE_MIGRATE:false}
      transactions:
        enabled: ${AI_MEMORY_TRANSACTIONS_ENABLED:false}
        name-server: ${AI_MEMORY_MQ_NAME_SERVER:}
        topic: ${AI_MEMORY_MQ_TOPIC:}
        producer-group: ${AI_MEMORY_MQ_PRODUCER_GROUP:}
        consumer-group: ${AI_MEMORY_MQ_CONSUMER_GROUP:}
        generation: ${AI_MEMORY_REDIS_GENERATION:}
        evidence-retention-seconds: ${AI_MEMORY_EVIDENCE_RETENTION_SECONDS:0}
        recovery-window-seconds: ${AI_MEMORY_RECOVERY_WINDOW_SECONDS:0}
      # Opt-in M03: explicit model budgets/watermarks are required. No fabricated provider TTL defaults.
      summary:
        enabled: ${AI_MEMORY_SUMMARY_ENABLED:false}
        accepting: ${AI_MEMORY_SUMMARY_ACCEPTING:true}
      vector:
        enabled: ${AI_MEMORY_VECTOR_ENABLED:true}
        writes-enabled: ${AI_MEMORY_VECTOR_WRITES_ENABLED:true}
