name: Agent

on:
  push:
    paths:
      - 'agent/**'
      - 'picture/**'
      - '.github/workflows/agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'picture/**'
      - '.github/workflows/agent.yml'

permissions:
  contents: read

jobs:
  verify-memory-transactions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: agent/pom.xml
      - name: Start isolated durable Redis, MySQL and RocketMQ
        run: bash agent/src/test/fixtures/memory-transactions/start.sh
      - name: Verify transaction acceptance, checkback and archival recovery
        run: mvn -B -ntp -f agent/pom.xml verify -Pmemory-transactions -Dmemory.transactions.fixture=agent-transactions-integration-only
      - name: Stop and remove only the isolated transaction fixtures
        if: always()
        run: docker compose -f agent/src/test/fixtures/memory-transactions/compose.yaml down --volumes
      - name: Upload transaction test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-memory-transactions-java-${{ matrix.java }}
          path: |
            agent/target/surefire-reports/
            agent/target/failsafe-reports/
  verify-mysql-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: agent/pom.xml
      - name: Start isolated MySQL archive fixture
        run: |
          docker run -d --rm --name suts-archive-ci -p 127.0.0.1:13306:3306 -e MYSQL_ROOT_PASSWORD=agent-archive-integration-only -e MYSQL_DATABASE=agent_archive_it mysql:8.0.46
          for attempt in {1..60}; do
            if docker exec -e MYSQL_PWD=agent-archive-integration-only suts-archive-ci mysql -h127.0.0.1 -uroot agent_archive_it -N -e 'SELECT 1'; then break; fi
            sleep 1
          done
          docker exec -e MYSQL_PWD=agent-archive-integration-only suts-archive-ci mysql -uroot agent_archive_it -e "CREATE TABLE suts_agent_test_fixture (marker VARCHAR(64) NOT NULL PRIMARY KEY); INSERT INTO suts_agent_test_fixture VALUES ('agent-archive-integration-only');"
      - name: Verify MySQL transaction and recovery contracts
        run: mvn -B -ntp -f agent/pom.xml verify -Pmysql-archive -Dmysql.archive.port=13306
      - name: Stop isolated MySQL
        if: always()
        run: docker stop suts-archive-ci || true
      - name: Upload archive test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-mysql-archive-java-17
          path: |
            agent/target/surefire-reports/
            agent/target/failsafe-reports/
  verify-vector-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: agent/pom.xml
      - name: Start isolated Redis Query Engine and JSON
        run: |
          docker run -d --rm --name suts-memory-ci -p 127.0.0.1:16379:6379 redis:8.2.1 redis-server --save "" --appendonly no --requirepass agent-vector-integration-only
          for attempt in {1..30}; do
            if docker exec suts-memory-ci redis-cli --no-auth-warning -a agent-vector-integration-only PING; then break; fi
            sleep 1
          done
          docker exec suts-memory-ci redis-cli --no-auth-warning -a agent-vector-integration-only SET suts:agent:test:redis-vector-fixture agent-vector-integration-only
      - name: Verify real vector store and data migration
        run: mvn -B -ntp -f agent/pom.xml verify -Predis-vector -Dredis.vector.port=16379
      - name: Stop isolated Redis
        if: always()
        run: docker stop suts-memory-ci || true
      - name: Upload vector test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-vector-memory-java-17
          path: |
            agent/target/surefire-reports/
            agent/target/failsafe-reports/
  verify-picture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: picture/pom.xml
      - name: Verify Picture vision contract
        run: mvn -B -ntp -f picture/pom.xml clean verify
      - name: Upload Picture reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picture-tests-java-17
          path: picture/target/surefire-reports/
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: agent/pom.xml
      - name: Verify application and API contracts
        run: mvn -B -ntp -f agent/pom.xml clean verify
      - name: Install isolated integration test prerequisite
        if: matrix.java == '17'
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Verify with a private Redis process
        if: matrix.java == '17'
        run: mvn -B -ntp -f agent/pom.xml verify -Plocal-redis -Dredis.server.executable=/usr/bin/redis-server
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-tests-java-${{ matrix.java }}
          path: |
            agent/target/surefire-reports/
            agent/target/failsafe-reports/
